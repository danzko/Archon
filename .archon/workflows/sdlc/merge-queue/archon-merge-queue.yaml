name: archon-merge-queue
description: >-
  Assess an explicit bounded list of GitHub PRs, then merge eligible changes
  sequentially using gh and GitHub branch protection. Agents inspect current
  review and CI evidence; no forge engine extension is required.
model: medium
interactive: true
mutates_checkout: false
inputs:
  prs:
    required: true
    description: JSON array of 1-5 explicit PR URLs in this repository.
  mode:
    default: approve
    description: preview only assesses; approve waits for a human; auto authorizes this batch.
  evidence:
    default: ''
    description: Optional runtime/review report paths or structured evidence for this batch.
returns: merge
nodes:
  - id: assess
    command: assess-merge-queue
    context: fresh
    with:
      prs: "$INPUTS.prs"
      evidence: "$INPUTS.evidence"
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        summary: { type: string }
      required: [ready, summary]

  - id: approval
    depends_on: [review-anthropic, review-zai]
    when: "$assess.output.ready == true && $INPUTS.mode == 'approve'"
    approval:
      message: "Approve the PRs and pinned heads in $ARTIFACTS_DIR/merge-plan.json? $assess.output.summary"
      decisions:
        - id: approve
          label: Merge eligible PRs
        - id: hold
          label: Hold batch

  - id: freeze
    script: freeze-merge-batch
    runtime: uv
    depends_on: [assess]
    with:
      ready: "$assess.output.ready"
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        batch: { type: object }
        summary: { type: string }
      required: [ready, batch, summary]

  - id: review-anthropic
    command: review-merge-candidate
    model: '@review-anthropic'
    context: fresh
    mutates_checkout: false
    depends_on: [freeze]
    when: "$freeze.output.ready == true"
    with:
      batch: "$freeze.output.batch"
      destination: "$ARTIFACTS_DIR/merge-reviews/anthropic/report.md"
    output_format: &review-output
      type: object
      properties:
        reviews:
          type: array
          items:
            type: object
            properties:
              repository: { type: string }
              number: { type: integer }
              head_sha: { type: string }
              ready: { type: boolean }
              action: { type: string, enum: [none, correct, replan] }
              findings: { type: string }
            required: [repository, number, head_sha, ready, action, findings]
      required: [reviews]

  - id: review-zai
    command: review-merge-candidate
    model: '@review-zai'
    context: fresh
    mutates_checkout: false
    depends_on: [freeze]
    when: "$freeze.output.ready == true"
    with:
      batch: "$freeze.output.batch"
      destination: "$ARTIFACTS_DIR/merge-reviews/zai/report.md"
    output_format: *review-output

  - id: merge
    script: merge-approved-prs
    runtime: uv
    depends_on: [freeze, review-anthropic, review-zai, approval]
    trigger_rule: none_failed_min_one_success
    with:
      ready: "$freeze.output.ready"
      mode: "$INPUTS.mode"
      approval: { from: "$approval.output", if_skipped: null }
      batch: "$freeze.output.batch"
      anthropic: { from: "$review-anthropic.output", if_skipped: null }
      zai: { from: "$review-zai.output", if_skipped: null }
    output_format:
      type: object
      properties:
        merged: { type: boolean }
        urls: { type: array, items: { type: string } }
        summary: { type: string }
      required: [merged, urls, summary]
